<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talus — 프로토타입</title>
<style>
  :root{
    --ink:#E8DFD2; --panel:#1A1720; --panel2:#231E2B; --line:#3A3243;
    --accent:#3DDCFF; --warn:#FF3D9E; --ok:#B4FF3D; --gold:#D99A5B;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:#120F17; color:var(--ink); overflow:hidden; font-size:12px;
       font-family:ui-sans-serif,-apple-system,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
  #app{display:grid; grid-template-columns:246px minmax(0,1fr) 214px; height:100vh; gap:1px; background:var(--line)}
  aside{background:var(--panel); overflow-y:auto; padding:9px 9px 40px}
  main{background:#0C0A11; display:flex; flex-direction:column; min-width:0}

  h1{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
  h1 small{display:block; letter-spacing:0; text-transform:none; color:#8A8175; font-size:10px; margin-top:2px}
  h2{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#9A8F7F;
     margin:12px 0 5px; padding-bottom:3px; border-bottom:1px solid var(--line)}

  .row{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:5px}
  button{font:inherit; font-size:11px; color:var(--ink); background:var(--panel2);
         border:1px solid var(--line); border-radius:3px; padding:5px 7px; cursor:pointer; flex:1 1 auto}
  button:hover:not(:disabled){background:#2E2738; border-color:#4C4258}
  button:disabled{opacity:.35; cursor:default}
  button.on{background:var(--accent); border-color:var(--accent); color:#0C0A11; font-weight:600}
  button.wide{flex-basis:100%}
  button.fire{background:var(--warn); border-color:var(--warn); color:#0C0A11; font-weight:700; padding:9px}
  button.fire:disabled{background:var(--panel2); border-color:var(--line); color:#6E6478; font-weight:400}

  .p{margin-bottom:6px}
  .p label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; gap:6px}
  .p .nm{color:#B8AC9A; font-size:10.5px}
  .p .vl{font-family:ui-monospace,"Martian Mono",monospace; font-variant-numeric:tabular-nums; font-size:11px}
  .p input[type=range]{width:100%; height:14px; -webkit-appearance:none; background:transparent; cursor:pointer}
  .p input[type=range]::-webkit-slider-runnable-track{height:3px; background:var(--line); border-radius:2px}
  .p input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:11px; height:11px; margin-top:-4px; border-radius:50%; background:var(--gold)}
  .p .hint{color:#6E6478; font-size:9.5px; margin-top:1px; line-height:1.35}
  .chk{display:flex; align-items:center; gap:6px; margin-bottom:5px; color:#B8AC9A; cursor:pointer; font-size:10.5px}
  .chk input{accent-color:var(--accent)}

  #wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:6px; min-height:0}
  #stage{position:relative; aspect-ratio:16/9; width:1400px; max-width:100%; max-height:100%;
         box-shadow:0 0 0 1px var(--line),0 16px 44px #0009; cursor:crosshair; touch-action:none}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #ovl{pointer-events:none}

  #bar{display:flex; gap:14px; align-items:center; padding:6px 11px; border-top:1px solid var(--line);
       background:var(--panel); font-family:ui-monospace,"Martian Mono",monospace;
       font-variant-numeric:tabular-nums; font-size:12px; flex-wrap:wrap}
  #bar b{color:#8A8175; font-weight:400; letter-spacing:.08em; text-transform:uppercase; font-size:9.5px; margin-right:3px}
  #bar .big{font-size:15px}

  .aim{display:grid; grid-template-columns:auto 1fr; gap:3px 7px; align-items:center; margin-bottom:6px}
  .aim span{color:#8A8175; font-size:10px; letter-spacing:.06em; text-transform:uppercase}
  .aim input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:3px;
             color:var(--ink); padding:4px 5px; font-family:ui-monospace,monospace;
             font-variant-numeric:tabular-nums; font-size:13px}

  .wsel{display:flex; flex-direction:column; gap:3px; margin-bottom:6px}
  .wsel button{display:flex; justify-content:space-between; align-items:baseline; text-align:left; padding:4px 6px; flex:none}
  .wsel button i{font-style:normal; font-family:ui-monospace,monospace; color:#8A8175; font-size:10px}
  .wsel button.on i{color:#0C0A11}
  .wsel .d{display:block; color:#6E6478; font-size:9px; margin-top:1px; line-height:1.3}
  .wsel button.on .d{color:#0C0A11; opacity:.75}

  .pcard{padding:5px 6px; border:1px solid var(--line); border-radius:4px; margin-bottom:4px; background:#15121C}
  .pcard.turn{border-color:var(--accent); background:#17222A}
  .pcard.dead{opacity:.35}
  .pcard .nm{display:flex; justify-content:space-between; font-size:11px; align-items:baseline}
  .pcard .sub{display:flex; justify-content:space-between; color:#8A8175; font-size:9.5px;
              font-family:ui-monospace,monospace; margin-top:2px}
  .hpbar{height:4px; background:#2A2432; border-radius:2px; overflow:hidden; margin-top:3px}
  .hpbar i{display:block; height:100%}

  #log{margin-top:5px; font-family:ui-monospace,"Martian Mono",monospace; font-size:10px; line-height:1.5;
       color:#9A8F7F; max-height:150px; overflow-y:auto; background:#15121C; border:1px solid var(--line);
       border-radius:3px; padding:5px; white-space:pre-wrap}
  #log b{color:var(--ok); font-weight:400} #log i{color:var(--warn); font-style:normal}
  #log em{color:var(--accent); font-style:normal} #log u{color:var(--gold); text-decoration:none}
  .note{color:#6E6478; font-size:9.5px; line-height:1.5; margin-top:5px}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px; border-radius:3px;
      padding:0 3px; font-family:ui-monospace,monospace; font-size:9.5px; color:#B8AC9A}

  /* 모달 — 상점 / 매치 종료 / 설정 */
  #modal{position:fixed; inset:0; background:#0A0810EE; display:none; align-items:center;
         justify-content:center; z-index:50; padding:20px}
  #modal.on{display:flex}
  #mbox{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 20px;
        max-width:820px; width:100%; max-height:90vh; overflow-y:auto}
  #mbox h3{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:4px}
  #mbox .sub{color:#8A8175; font-size:11px; margin-bottom:14px}
  .shopgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:7px; margin-bottom:14px}
  .shopgrid button{display:block; text-align:left; padding:7px 9px; flex:none}
  .shopgrid .t{display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px}
  .shopgrid .t u{color:var(--gold); text-decoration:none; font-family:ui-monospace,monospace}
  .shopgrid .d{color:#6E6478; font-size:9.5px; margin-top:2px; line-height:1.35}
  .shopgrid .have{font-family:ui-monospace,monospace; color:var(--accent); font-size:10px}
  table.sc{width:100%; border-collapse:collapse; font-family:ui-monospace,monospace;
           font-variant-numeric:tabular-nums; font-size:11.5px; margin-bottom:12px}
  table.sc th{color:#8A8175; font-weight:400; text-align:right; padding:3px 6px; font-size:9.5px;
              text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--line)}
  table.sc th:first-child, table.sc td:first-child{text-align:left}
  table.sc td{padding:3px 6px; text-align:right}
  .setrow{display:flex; gap:6px; align-items:center; margin-bottom:5px; font-size:11px}
  .setrow .sl{width:52px; color:#8A8175; font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>Talus<small id="hdr">Phase 1 프로토타입</small></h1>

  <h2>조준 <span id="whoTurn" style="color:var(--accent)"></span></h2>
  <div class="aim">
    <span>각도</span><input type="number" id="iAngle" min="0" max="180" step="0.1">
    <span>파워</span><input type="number" id="iPower" min="0" max="1000" step="1">
    <span>이동</span><input type="number" id="iMove" min="-30" max="30" step="1" value="0">
  </div>
  <label class="chk"><input type="checkbox" id="cShield"><span>차폐막 사용 <span id="shieldHave" style="color:#6E6478"></span></span></label>
  <div class="row"><button id="bFire" class="fire wide">발사</button></div>
  <div class="note">
    <kbd>←</kbd><kbd>→</kbd> 각도 · <kbd>↑</kbd><kbd>↓</kbd> 파워 · <kbd>Shift</kbd> 미세<br>
    <kbd>1</kbd>~<kbd>7</kbd> 무기 · <kbd>Space</kbd> 발사 · 드래그 조준
  </div>

  <h2>무기</h2>
  <div class="wsel" id="wsel"></div>

  <h2>플레이어</h2>
  <div id="cards"></div>

  <h2>매치</h2>
  <div class="row"><button id="bSetup" class="wide">새 매치 설정</button></div>
  <div class="row"><button id="bScores">점수판</button><button id="bShop">상점</button></div>
  <div id="log">준비됨.</div>
</aside>

<main>
  <div id="wrap"><div id="stage">
    <canvas id="ter" width="960" height="540"></canvas>
    <canvas id="ovl" width="960" height="540"></canvas>
  </div></div>
  <div id="bar">
    <span><b>라운드</b><span id="oRound" class="big">1</span><span style="color:#6E6478">/5</span></span>
    <span><b>턴</b><span id="oTurn">1</span></span>
    <span><b>바람</b><span id="oWind" class="big">—</span></span>
    <span><b>단계</b><span id="oPhase">조준</span></span>
    <span><b>각도</b><span id="oAngle">—</span></span>
    <span><b>파워</b><span id="oPower">—</span></span>
    <span><b>정착</b><span id="oSettle">—</span></span>
    <span><b>fps</b><span id="oFps">—</span></span>
  </div>
</main>

<aside>
  <h2>튜닝 <span style="color:#6E6478">simulation.md §8</span></h2>
  <div class="p"><label><span class="nm">POWER_SCALE</span><span class="vl" id="vPS"></span></label>
    <input type="range" id="sPS" min="256" max="704" step="16"></div>
  <div class="p"><label><span class="nm">GRAVITY</span><span class="vl" id="vG"></span></label>
    <input type="range" id="sG" min="4" max="24" step="1"></div>
  <div class="p"><label><span class="nm">WIND_MAX</span><span class="vl" id="vWM"></span></label>
    <input type="range" id="sWM" min="0" max="8" step="1"></div>
  <div class="p"><label><span class="nm">SUBSTEPS</span><span class="vl" id="vSub"></span></label>
    <input type="range" id="sSub" min="1" max="64" step="1">
    <div class="hint">붕괴 재생 속도. 시뮬 결과는 안 바뀐다</div></div>
  <div class="p"><label><span class="nm">SLIDE_SAND</span><span class="vl" id="vCS"></span></label>
    <input type="range" id="sCS" min="0" max="256" step="1"></div>
  <div class="p"><label><span class="nm">SLIDE_SOIL</span><span class="vl" id="vCL"></span></label>
    <input type="range" id="sCL" min="0" max="256" step="1"></div>
  <table class="sc"><tr><td>최대 사거리</td><td id="oRange">—</td></tr>
    <tr><td>맵 폭 대비</td><td id="oPct">—</td></tr></table>

  <h2>표시</h2>
  <label class="chk"><input type="checkbox" id="cTrail" checked><span>탄도 잔상</span></label>
  <label class="chk"><input type="checkbox" id="cPredict"><span>궤적 미리보기 <span style="color:#6E6478">(치트)</span></span></label>
  <label class="chk"><input type="checkbox" id="cFast"><span>붕괴 빨리 넘기기</span></label>
</aside>
</div>

<div id="modal"><div id="mbox"></div></div>

<!-- [SIM] — 순서 중요 -->
<script src="../sandbox/automaton.js"></script>
<script src="../sandbox/lab.js"></script>
<script src="sim.js"></script>
<script src="weapons.js"></script>
<script src="match.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   Talus 프로토타입 UI  [TOOL]

   시뮬레이션은 automaton.js(지형) / sim.js(탄도) / weapons.js / match.js 에 있다.
   여기에는 렌더러와 입력, 화면 전환만 둔다.

   턴 흐름 (game-design.md §4.1 — 동시 조준 + 동시 해결):
     AIM      전원 intent 수집. 사람은 핫시트로 한 명씩, AI 는 자동
     RESOLVE  전원 궤적을 동시에 재생
     SETTLE   폭발 → 연결성 → 정착 (terrain.md §6.1 루프)
     APPLY    재배치 · 낙하 · 매몰 · 사망
     ROUND    라운드 종료 판정 → 상점 → 다음 라운드
   ═══════════════════════════════════════════════════════════════════════════ */
const T = window.TalusSim, L = window.TalusLab, P = window.TalusPhys,
      Wp = window.TalusWeapons, M = window.TalusMatch;
const W = T.W, H = T.H, grid = T.grid, EMPTY = T.EMPTY;
const CELL = P.CELL_SUBPX, CSH = P.CELL_SHIFT;
const $ = (id) => document.getElementById(id);

const TEAM = ["#3DDCFF", "#B4FF3D", "#FF3D9E", "#9D6BFF", "#FFB33D", "#3DFFC2"];
const MARK = ["●", "■", "▲", "◆", "★", "✚"];
const NAMES = ["시안", "라임", "마젠타", "바이올렛", "앰버", "민트"];

const logEl = $("log");
function log(html) {
  const d = document.createElement("div"); d.innerHTML = html;
  logEl.insertBefore(d, logEl.firstChild);
  while (logEl.childNodes.length > 60) logEl.removeChild(logEl.lastChild);
}

/* ══════════════════ 게임 상태 ══════════════════ */
const G = {
  phase: "AIM", round: 1, turnNo: 0, roundTurn: 0,
  wind: 0, players: [], spawnXs: [],
  cur: 0,                       // 지금 입력 차례인 사람 슬롯
  legs: [], legIdx: 0, legTick: 0,
  dets: [], trails: [],
  settleSteps: 0, connRounds: 0,
  substeps: 20, seed: 0x55,
  showTrail: true, showPredict: false, fast: false,
  cfgPlayers: [{ ai: false }, { ai: true }],
  aiLevel: "normal",
};

const humans = () => G.players.filter((p) => p.alive && !p.isAI);
const alive = () => G.players.filter((p) => p.alive);

function measureMaxRange() { return P.flatRangePx(450, 1000, 0); }
function showRange() {
  const r = measureMaxRange();
  $("oRange").textContent = r + " px";
  const pct = r / 1920 * 100;
  $("oPct").textContent = pct.toFixed(1) + "%";
  $("oPct").style.color = Math.abs(pct - 100) <= 5 ? "var(--ok)" : "var(--warn)";
}

/* 바람은 라운드마다 파생 (game-design.md §9, decisions.md B3) */
function deriveWind() {
  const h = T.hash32(G.seed ^ 0x5715, G.round, 0, 0);
  const span = P.CFG.windMax * 2 + 1;
  G.wind = (h % span) - P.CFG.windMax;
}
/* turnSeed = hash32(mapSeed, turnNo, 0, 0) — decisions.md B2 확정 */
function applyTurnSeed() { T.CFG.seed = T.hash32(G.seed, G.turnNo, 0, 0); }

/* ══════════════════ 매치 시작 ══════════════════ */
function newMatch() {
  T.CFG.seed = G.seed;                       // 맵 생성은 mapSeed 로
  L.loadPreset("hills");
  L.settleHeadless(60000);                   // 생성 직후 안정화 (decisions.md B1-6)

  const n = G.cfgPlayers.length;
  const maxR = measureMaxRange();
  /* 스폰 간격은 맵 폭의 2/3 안에 균등 배치. 사거리(≈맵 폭) 안이라 서로 닿는다 (B12) */
  const span = 1280, left = (1920 - span) / 2;
  G.spawnXs = [];
  for (let i = 0; i < n; i++) {
    const px = n === 1 ? 960 : left + span * i / (n - 1);
    G.spawnXs.push(Math.round(px * 16));
  }
  G.players = [];
  for (let i = 0; i < n; i++) {
    G.players.push(M.makePlayer(i, NAMES[i], G.cfgPlayers[i].ai, G.spawnXs[i]));
  }
  M.beginRound(G.players, G.spawnXs);
  G.round = 1; G.turnNo = 0; G.roundTurn = 0;
  G.trails.length = 0; G.legs = []; G.dets = [];
  applyTurnSeed(); deriveWind();
  renderAll = true;
  $("oRound").textContent = G.round;
  log(`<em>새 매치</em> — ${n}인 · 시드 0x${G.seed.toString(16).toUpperCase()} · 최대 사거리 ${maxR}px`);
  beginTurn();
}

function beginTurn() {
  G.turnNo++; G.roundTurn++;
  applyTurnSeed();
  for (const pl of G.players) pl.intent = null;
  G.phase = "AIM";
  /* AI intent 를 먼저 다 채운다 */
  for (const pl of G.players) {
    if (pl.alive && pl.isAI)
      pl.intent = M.aiIntent(G.players, pl, G.wind, G.turnNo, G.seed, G.aiLevel);
  }
  nextHuman();
}

/* 다음 입력 대기 사람으로 넘어간다. 없으면 즉시 해결 */
function nextHuman() {
  const pending = G.players.filter((p) => p.alive && !p.isAI && !p.intent);
  if (pending.length === 0) { resolve(); return; }
  G.cur = pending[0].slot;
  syncAim(); drawCards(); syncWeapons();
  $("bFire").disabled = false;
  renderAll = true;
}

function commitAim() {
  if (G.phase !== "AIM") return;
  const pl = G.players[G.cur];
  if (!pl || !pl.alive || pl.isAI) return;
  pl.intent = {
    angle10: pl.angle10, power: pl.power, weaponId: pl.weaponId,
    moveDx: parseInt($("iMove").value, 10) || 0,
    useShield: $("cShield").checked,
  };
  $("iMove").value = 0; $("cShield").checked = false;
  $("bFire").disabled = true;
  nextHuman();
}

/* ══════════════════ 해결 ══════════════════ */
function resolve() {
  const r = M.resolveTurn(G.players, G.wind);
  for (const e of r.events) logEvent(e);
  G.legs = r.legs; G.dets = r.dets;
  G.legIdx = 0; G.legTick = 0;
  G.phase = "RESOLVE";
  $("bFire").disabled = true;
  if (G.legs.length === 0) onAllLegsDone();
}

function onAllLegsDone() {
  if (G.showTrail) {
    for (const leg of G.legs) {
      if (leg.pts.length > 1) G.trails.push({ slot: leg.slot, pts: leg.pts, age: 0 });
    }
    while (G.trails.length > 24) G.trails.shift();
  }
  const ap = M.applyDetonations(G.players, G.dets);
  for (const e of ap.events) logEvent(e);
  if (ap.filled) log(`  <u>적층</u> ${ap.filled.toLocaleString()}셀`);
  G.settleSteps = 0; G.connRounds = 0;
  G.phase = "SETTLE";
  renderAll = true;
}

function settleTick(budget) {
  for (let k = 0; k < budget; k++) {
    if (G.settleSteps >= 12000) { log("<i>MAX_SETTLE_STEPS 도달 — 강제 종료</i>"); return endSettle(); }
    const r = T.step();
    G.settleSteps++;
    if (r.mobile === 0) {
      const conv = T.connectivity();
      G.connRounds++;
      if (conv > 0 && G.connRounds < M_CONN_MAX) {
        log(`  <em>연결성 재검사</em> ROCK→SCREE ${conv.toLocaleString()}셀 — 정착 재개`);
        continue;                            // step 은 리셋하지 않는다 (terrain.md §7.1)
      }
      return endSettle();
    }
  }
}
const M_CONN_MAX = 8;

function endSettle() {
  /* 붕괴 귀속 — 이번 턴 마지막 폭발의 소유자 (decisions.md C10) */
  const owner = G.dets.length ? G.dets[G.dets.length - 1].owner : null;
  const ev = M.applyPhase(G.players, owner);
  for (const e of ev) logEvent(e);
  drawCards();
  const out = M.roundOutcome(G.players, G.roundTurn);
  if (out.over) return endRound(out);
  for (const tr of G.trails) tr.age++;
  G.phase = "AIM";
  beginTurn();
}

function endRound(out) {
  G.phase = "ROUND";
  const ev = M.closeRound(G.players, out);
  const w = out.winner != null ? G.players[out.winner] : null;
  log(`<b>라운드 ${G.round} 종료</b> — ${
    out.reason === "last" ? `${w.name} 생존` :
    out.reason === "wipe" ? "전멸. 무승부" : `턴 상한. ${w ? w.name + " 승" : "무승부"}`}`);
  drawCards();

  if (G.round >= M.RULES.rounds) return showFinal();
  /* AI 상점을 먼저 처리하고 사람에게 상점을 띄운다 */
  for (const pl of G.players) {
    if (!pl.isAI) continue;
    const b = M.aiShop(pl, G.seed, G.round);
    if (b.length) log(`  ${pl.name} 구매: ${b.join(", ")}`);
  }
  G.round++;
  $("oRound").textContent = G.round;
  deriveWind();
  if (humansConfigured()) showShop();
  else { startNextRound(); }
}
const humansConfigured = () => G.cfgPlayers.some((c) => !c.ai);

function startNextRound() {
  M.beginRound(G.players, G.spawnXs);
  G.roundTurn = 0;
  renderAll = true;
  closeModal();
  beginTurn();
}

function logEvent(e) {
  const nm = (s) => {
    const p = G.players.find((q) => q.slot === s);
    return p ? `<span style="color:${TEAM[s]}">${p.name}</span>` : "?";
  };
  switch (e.t) {
    case "fire": log(`${nm(e.slot)} ${e.weapon} — ${(e.angle10 / 10).toFixed(1)}° / ${e.power}`); break;
    case "move": log(`  ${nm(e.slot)} ${e.cells}셀 이동`); break;
    case "shield": log(`  ${nm(e.slot)} 차폐막 전개`); break;
    case "blocked": log(`  <em>${nm(e.slot)} 차폐막이 막았다</em>`); break;
    case "damage": log(`  ${nm(e.slot)} 피해 ${e.dmg} (${e.distPx}px)`); break;
    case "conv": log(`  <em>연결성 검사</em> ROCK→SCREE ${e.cells.toLocaleString()}셀`); break;
    case "falldamage": log(`  ${nm(e.slot)} ${e.fallPx}px 낙하 → 피해 ${e.dmg}`); break;
    case "parachute": log(`  <em>${nm(e.slot)} 낙하산 전개</em> (${e.fallPx}px)`); break;
    case "buried": log(`  <i>${nm(e.slot)} 매몰 ${e.pct}%</i> → 피해 ${e.dmg}`); break;
    case "unburied": log(`  ${nm(e.slot)} 매몰 해제`); break;
    case "outofmap": log(`  <i>${nm(e.slot)} 화면 밖 이탈 — 즉사</i>`); break;
    case "dead": log(`<i>${nm(e.slot)} 파괴</i>`); break;
  }
}

/* ══════════════════ 모달 ══════════════════ */
function closeModal() { $("modal").classList.remove("on"); }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

function showShop() {
  const box = $("mbox");
  const hs = G.players.filter((p) => !p.isAI);
  let idx = 0;
  function render() {
    const pl = hs[idx];
    if (!pl) { startNextRound(); return; }
    let h = `<h3>상점 — 라운드 ${G.round}</h3>`
      + `<div class="sub"><b style="color:${TEAM[pl.slot]}">${pl.name}</b> · 보유 `
      + `<u style="color:var(--gold);text-decoration:none;font-family:ui-monospace">${pl.gold.toLocaleString()}</u> G`
      + ` · 라운드 사이에만 열린다 (game-design.md §7)</div><div class="shopgrid">`;
    for (const w of Wp.WEAPONS) {
      if (w.ammo0 === null) continue;
      const can = pl.gold >= w.price;
      h += `<button data-buy="w${w.id}" ${can ? "" : "disabled"}>`
        + `<div class="t"><span>${w.name}</span><u>${w.price}G</u></div>`
        + `<div class="d">${w.desc}</div>`
        + `<div class="have">보유 ${M.ammoOf(pl, w.id)}발</div></button>`;
    }
    for (const it of Wp.ITEMS) {
      const can = pl.gold >= it.price;
      h += `<button data-buy="i${it.key}" ${can ? "" : "disabled"}>`
        + `<div class="t"><span>${it.name}</span><u>${it.price}G</u></div>`
        + `<div class="d">${it.desc}</div>`
        + `<div class="have">보유 ${pl.items[it.key]}</div></button>`;
    }
    h += `</div><div class="row"><button class="wide" data-done="1">`
      + `${idx < hs.length - 1 ? "다음 플레이어" : "라운드 시작"}</button></div>`;
    box.innerHTML = h;
    box.querySelectorAll("[data-buy]").forEach((b) => b.onclick = () => {
      const v = b.dataset.buy;
      const ok = v[0] === "w" ? M.buyWeapon(pl, +v.slice(1)) : M.buyItem(pl, v.slice(1));
      if (ok) render();
    });
    box.querySelector("[data-done]").onclick = () => { idx++; render(); };
  }
  render();
  $("modal").classList.add("on");
}

function showScores(final) {
  const sorted = G.players.slice().sort((a, b) => b.score - a.score);
  let h = `<h3>${final ? "매치 종료" : "점수판"}</h3><div class="sub">`
    + `라운드 ${Math.min(G.round, M.RULES.rounds)} / ${M.RULES.rounds} · `
    + `누적 점수제 — 킬 ${M.RULES.killScore} + 피해 ×${M.RULES.damageScore} + 생존 ${M.RULES.surviveScore}</div>`
    + `<table class="sc"><tr><th>플레이어</th><th>점수</th><th>HP</th><th>골드</th><th>탄약</th></tr>`;
  for (const p of sorted) {
    const ammo = Wp.WEAPONS.filter((w) => w.ammo0 !== null && M.ammoOf(p, w.id) > 0)
      .map((w) => `${w.name[0]}${M.ammoOf(p, w.id)}`).join(" ") || "—";
    h += `<tr><td><span style="color:${TEAM[p.slot]}">${MARK[p.slot]} ${p.name}</span>`
      + `${p.isAI ? ' <span style="color:#6E6478">AI</span>' : ""}</td>`
      + `<td>${p.score}</td><td>${p.alive ? p.hp : "—"}</td><td>${p.gold.toLocaleString()}</td>`
      + `<td style="font-size:10px;color:#8A8175">${ammo}</td></tr>`;
  }
  h += `</table><div class="row">`;
  if (final) h += `<button class="wide" data-new="1">새 매치</button>`;
  else h += `<button class="wide" data-close="1">닫기</button>`;
  h += `</div>`;
  $("mbox").innerHTML = h;
  const nb = $("mbox").querySelector("[data-new]");
  if (nb) nb.onclick = () => { closeModal(); showSetup(); };
  const cb = $("mbox").querySelector("[data-close]");
  if (cb) cb.onclick = closeModal;
  $("modal").classList.add("on");
}
function showFinal() {
  const best = G.players.slice().sort((a, b) => b.score - a.score)[0];
  log(`<b>=== 매치 종료 — ${best.name} 우승 (${best.score}점) ===</b>`);
  showScores(true);
}

function showSetup() {
  let h = `<h3>새 매치</h3><div class="sub">인원 2~6 (game-design.md §3). `
    + `동시 조준 + 동시 해결 — 사람은 핫시트로 한 명씩 입력한다</div>`;
  h += `<div class="row" data-cnt="1">`;
  for (let n = 2; n <= 6; n++)
    h += `<button data-n="${n}" ${G.cfgPlayers.length === n ? 'class="on"' : ""}>${n}인</button>`;
  h += `</div><div style="margin:10px 0">`;
  for (let i = 0; i < G.cfgPlayers.length; i++) {
    h += `<div class="setrow"><span class="sl" style="color:${TEAM[i]}">${MARK[i]} ${NAMES[i]}</span>`
      + `<button data-role="${i}:h" ${!G.cfgPlayers[i].ai ? 'class="on"' : ""}>사람</button>`
      + `<button data-role="${i}:a" ${G.cfgPlayers[i].ai ? 'class="on"' : ""}>AI</button></div>`;
  }
  h += `</div><div class="setrow"><span class="sl">AI 난이도</span>`;
  for (const lv of [["easy", "쉬움"], ["normal", "보통"], ["hard", "어려움"]])
    h += `<button data-ai="${lv[0]}" ${G.aiLevel === lv[0] ? 'class="on"' : ""}>${lv[1]}</button>`;
  h += `</div><div class="setrow"><span class="sl">맵 시드</span>`
    + `<input type="number" id="setSeed" value="${G.seed}" min="0" max="255" `
    + `style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:4px 6px;font-family:ui-monospace">`
    + `<button data-rnd="1">±</button></div>`
    + `<div class="row" style="margin-top:12px"><button class="wide fire" data-start="1">시작</button></div>`;
  $("mbox").innerHTML = h;
  const box = $("mbox");
  box.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => {
    const n = +b.dataset.n, old = G.cfgPlayers;
    G.cfgPlayers = [];
    for (let i = 0; i < n; i++) G.cfgPlayers.push(old[i] || { ai: true });
    showSetup();
  });
  box.querySelectorAll("[data-role]").forEach((b) => b.onclick = () => {
    const [i, r] = b.dataset.role.split(":");
    G.cfgPlayers[+i].ai = (r === "a");
    showSetup();
  });
  box.querySelectorAll("[data-ai]").forEach((b) => b.onclick = () => { G.aiLevel = b.dataset.ai; showSetup(); });
  box.querySelector("[data-rnd]").onclick = () => {
    G.seed = (G.seed * 31 + 17) & 0xFF; $("setSeed").value = G.seed;
  };
  box.querySelector("[data-start]").onclick = () => {
    G.seed = Math.max(0, Math.min(255, parseInt($("setSeed").value, 10) || 0));
    closeModal(); newMatch();
  };
  $("modal").classList.add("on");
}

/* ══════════════════ 렌더 ══════════════════ */
const ter = $("ter"), tctx = ter.getContext("2d", { alpha: false });
const ovl = $("ovl"), octx = ovl.getContext("2d");
const img = tctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
const hexToRgb = (s) => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const c255 = (v) => v < 0 ? 0 : (v > 255 ? 255 : v | 0);
const abgr = (r, g, b) => ((255 << 24) | (c255(b) << 16) | (c255(g) << 8) | c255(r)) >>> 0;
const shade = (s, k) => { const c = hexToRgb(s); return abgr(c[0] * k, c[1] * k, c[2] * k); };
const MAT_HEX = [null, "#C9A56B", "#A6472E", "#8A8175", "#55606B", "#2C3239"];
const C_BASE = new Uint32Array(6), C_LIT = new Uint32Array(6), C_RIM = new Uint32Array(6);
for (let m = 1; m <= 5; m++) {
  C_BASE[m] = shade(MAT_HEX[m], 0.78); C_LIT[m] = shade(MAT_HEX[m], 1.28); C_RIM[m] = shade(MAT_HEX[m], 1.02);
}
const skyRow = new Uint32Array(H);
(function () {
  const z = hexToRgb("#3A2E4A"), m = hexToRgb("#7E5A50"), o = hexToRgb("#D99A5B");
  for (let y = 0; y < H; y++) {
    const t = y / (H - 1); let r, g, b;
    if (t < 0.62) { const u = t / 0.62; r = z[0] + (m[0] - z[0]) * u; g = z[1] + (m[1] - z[1]) * u; b = z[2] + (m[2] - z[2]) * u; }
    else { const u = (t - 0.62) / 0.38; r = m[0] + (o[0] - m[0]) * u; g = m[1] + (o[1] - m[1]) * u; b = m[2] + (o[2] - m[2]) * u; }
    skyRow[y] = abgr(r * 0.6, g * 0.6, b * 0.6);
  }
})();
let renderAll = true;
const dirtyRow = new Uint8Array(H);

function paintRow(y) {
  const base = y * W, sky = skyRow[y], up = y > 0 ? base - W : -1;
  for (let x = 0; x < W; x++) {
    const i = base + x, m = grid[i];
    if (m === EMPTY) { px[i] = sky; continue; }
    if (up < 0 || grid[up + x] === EMPTY) px[i] = C_LIT[m];
    else if (x > 0 && grid[up + x - 1] === EMPTY) px[i] = C_RIM[m];
    else px[i] = C_BASE[m];
  }
}
function renderTerrain() {
  const mN = T.getMovedCount(), mRow = T.moved.row, mDRow = T.moved.drow;
  if (renderAll) {
    for (let y = 0; y < H; y++) paintRow(y);
    tctx.putImageData(img, 0, 0); renderAll = false;
  } else if (mN > 0) {
    dirtyRow.fill(0);
    let lo = H, hi = -1;
    for (let i = 0; i < mN; i++) {
      let a = mRow[i] - 1, b = mDRow[i] + 2;
      if (a < 0) a = 0; if (b > H - 1) b = H - 1;
      for (let y = a; y <= b; y++) dirtyRow[y] = 1;
    }
    for (let y = 0; y < H; y++) if (dirtyRow[y]) { paintRow(y); if (y < lo) lo = y; if (y > hi) hi = y; }
    if (hi >= lo) tctx.putImageData(img, 0, 0, 0, lo, W, hi - lo + 1);
  }
}
const sx = (v) => v / CELL, sy = (v) => v / CELL;

function drawOverlay() {
  octx.clearRect(0, 0, W, H);

  if (G.showTrail) {
    for (const tr of G.trails) {
      octx.strokeStyle = TEAM[tr.slot]; octx.globalAlpha = Math.max(.05, .45 - tr.age * .05);
      octx.lineWidth = 1; octx.beginPath();
      for (let i = 0; i < tr.pts.length; i++) {
        const X = sx(tr.pts[i].x), Y = sy(tr.pts[i].y);
        i === 0 ? octx.moveTo(X, Y) : octx.lineTo(X, Y);
      }
      octx.stroke(); octx.globalAlpha = 1;
    }
  }

  if (G.showPredict && G.phase === "AIM") {
    const pl = G.players[G.cur];
    if (pl && pl.alive && !pl.isAI) {
      const m = P.muzzle(pl, pl.angle10);
      const w = M.effectiveWeapon(pl, pl.weaponId);
      const r = Wp.resolveShot(m.x, m.y, pl.angle10, pl.power, G.wind, pl.slot, G.players, w);
      octx.strokeStyle = TEAM[pl.slot]; octx.globalAlpha = .3;
      octx.setLineDash([3, 5]); octx.lineWidth = 1;
      for (const leg of r.legs) {
        octx.beginPath();
        for (let i = 0; i < leg.pts.length; i++) {
          const X = sx(leg.pts[i].x), Y = sy(leg.pts[i].y);
          i === 0 ? octx.moveTo(X, Y) : octx.lineTo(X, Y);
        }
        octx.stroke();
      }
      octx.setLineDash([]); octx.globalAlpha = 1;
    }
  }

  /* 탱크 */
  for (const pl of G.players) {
    const X = sx(pl.x), Y = sy(pl.y), w = P.TANK_W / CELL, h = P.TANK_H / CELL;
    octx.globalAlpha = pl.alive ? 1 : .22;
    octx.fillStyle = "#1D1A22"; octx.fillRect(X - w / 2, Y - h, w, h);
    octx.fillStyle = TEAM[pl.slot]; octx.fillRect(X - w / 2, Y - h, w, 2);
    octx.font = "7px ui-monospace"; octx.textAlign = "center";
    octx.fillText(MARK[pl.slot], X, Y - h - 4);
    if (pl.buried) { octx.strokeStyle = "#FF3D9E"; octx.lineWidth = 1; octx.strokeRect(X - w / 2 - 1, Y - h - 1, w + 2, h + 2); }
    if (pl.shieldUp) { octx.strokeStyle = "#3DDCFF"; octx.lineWidth = 1; octx.beginPath(); octx.arc(X, Y - h / 2, w, 0, 6.2832); octx.stroke(); }
    if (pl.alive) {
      const m = P.muzzle(pl, pl.angle10);
      octx.strokeStyle = (pl.slot === G.cur && G.phase === "AIM") ? "#E8DFD2" : TEAM[pl.slot];
      octx.lineWidth = 1.6; octx.beginPath();
      octx.moveTo(X, Y - h); octx.lineTo(sx(m.x), sy(m.y)); octx.stroke();
      /* HP 바 */
      octx.fillStyle = "#00000088"; octx.fillRect(X - w / 2, Y - h - 11, w, 2.5);
      octx.fillStyle = pl.hp > 40 ? "#B4FF3D" : "#FF3D9E";
      octx.fillRect(X - w / 2, Y - h - 11, w * pl.hp / 100, 2.5);
    }
    octx.globalAlpha = 1;
  }

  /* 비행 중 — 재생 중인 leg 들 */
  if (G.phase === "RESOLVE") {
    for (let li = 0; li <= G.legIdx && li < G.legs.length; li++) {
      const leg = G.legs[li];
      const upto = li < G.legIdx ? leg.pts.length - 1 : Math.min(G.legTick, leg.pts.length - 1);
      octx.strokeStyle = TEAM[leg.slot]; octx.globalAlpha = .8; octx.lineWidth = 1.4;
      octx.beginPath();
      for (let k = 0; k <= upto; k++) {
        const X = sx(leg.pts[k].x), Y = sy(leg.pts[k].y);
        k === 0 ? octx.moveTo(X, Y) : octx.lineTo(X, Y);
      }
      octx.stroke(); octx.globalAlpha = 1;
      if (li === G.legIdx && leg.pts[upto]) {
        octx.fillStyle = "#FFF4E0"; octx.beginPath();
        octx.arc(sx(leg.pts[upto].x), sy(leg.pts[upto].y), 2, 0, 6.2832); octx.fill();
      }
    }
  }

  /* 조준 다이얼 */
  if (G.phase === "AIM") {
    const pl = G.players[G.cur];
    if (pl && pl.alive && !pl.isAI) {
      const X = sx(pl.x), Y = sy(pl.y) - P.TANK_H / CELL;
      octx.strokeStyle = "rgba(232,223,210,.2)"; octx.lineWidth = 1;
      octx.beginPath(); octx.arc(X, Y, 34, Math.PI, 0); octx.stroke();
      const rad = (pl.angle10 / 10) * Math.PI / 180;
      octx.strokeStyle = TEAM[pl.slot]; octx.lineWidth = 2;
      octx.beginPath(); octx.moveTo(X, Y);
      octx.lineTo(X + Math.cos(rad) * 34, Y - Math.sin(rad) * 34); octx.stroke();
    }
  }

  /* 바람 게이지 — 측풍계가 있으면 숫자까지 (§6.2, 정보는 숨기지 않는다) */
  const cxg = W / 2, wy = 15, half = 70;
  octx.strokeStyle = "rgba(232,223,210,.2)"; octx.lineWidth = 1;
  octx.beginPath(); octx.moveTo(cxg - half, wy); octx.lineTo(cxg + half, wy); octx.stroke();
  octx.beginPath(); octx.moveTo(cxg, wy - 4); octx.lineTo(cxg, wy + 4); octx.stroke();
  const wmax = Math.max(1, P.CFG.windMax);
  octx.strokeStyle = Math.abs(G.wind) > wmax * .6 ? "#FF3D9E" : "#D99A5B"; octx.lineWidth = 3;
  octx.beginPath(); octx.moveTo(cxg, wy); octx.lineTo(cxg + (G.wind / wmax) * half, wy); octx.stroke();
  const me = G.players[G.cur];
  if (me && me.items && me.items.anemo > 0) {
    octx.fillStyle = "#D99A5B"; octx.font = "9px ui-monospace"; octx.textAlign = "center";
    octx.fillText((G.wind >= 0 ? "+" : "") + G.wind, cxg, wy - 8);
  }

  if (mouse.in && G.phase === "AIM") {
    octx.strokeStyle = "rgba(232,223,210,.35)"; octx.lineWidth = 1;
    octx.beginPath(); octx.arc(mouse.x, mouse.y, 3, 0, 6.2832); octx.stroke();
  }
}

/* ══════════════════ 입력 ══════════════════ */
const stage = $("stage"), mouse = { x: -1, y: -1, in: false };
let dragging = false;
function toCell(ev) {
  const r = ter.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
function aimFromDrag(pt) {
  const pl = G.players[G.cur];
  if (!pl || !pl.alive || pl.isAI) return;
  const dx = sx(pl.x) - pt.x, dy = (sy(pl.y) - P.TANK_H / CELL) - pt.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 5) return;
  let deg = Math.atan2(dy, dx) * 180 / Math.PI;
  if (deg < 0) deg += 360;
  if (deg > 180) deg = deg < 270 ? 180 : 0;
  pl.angle10 = Math.max(0, Math.min(1800, Math.round(deg * 10)));
  pl.power = Math.max(0, Math.min(1000, Math.round(dist / 150 * 1000)));
  syncAim();
}
stage.addEventListener("pointerdown", (e) => {
  if (G.phase !== "AIM") return;
  stage.setPointerCapture(e.pointerId); dragging = true;
  const c = toCell(e); mouse.x = c.x; mouse.y = c.y; mouse.in = true; aimFromDrag(c);
});
stage.addEventListener("pointermove", (e) => {
  const c = toCell(e); mouse.x = c.x; mouse.y = c.y; mouse.in = true;
  if (dragging) aimFromDrag(c);
});
stage.addEventListener("pointerup", () => { dragging = false; });
stage.addEventListener("pointerleave", () => { mouse.in = false; dragging = false; });

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if ($("modal").classList.contains("on")) return;
  const pl = G.players[G.cur];
  if (G.phase !== "AIM" || !pl || !pl.alive || pl.isAI) return;
  const f = e.shiftKey;
  let used = true;
  switch (e.key) {
    case "ArrowLeft":  pl.angle10 = Math.min(1800, pl.angle10 + (f ? 1 : 5)); break;
    case "ArrowRight": pl.angle10 = Math.max(0, pl.angle10 - (f ? 1 : 5)); break;
    case "ArrowUp":    pl.power = Math.min(1000, pl.power + (f ? 1 : 5)); break;
    case "ArrowDown":  pl.power = Math.max(0, pl.power - (f ? 1 : 5)); break;
    case " ":          commitAim(); break;
    default:
      if (e.key >= "1" && e.key <= "7") { selectWeapon(+e.key - 1); }
      else used = false;
  }
  if (used) { e.preventDefault(); syncAim(); }
});

function selectWeapon(id) {
  const pl = G.players[G.cur];
  if (!pl || pl.isAI) return;
  if (!M.canFire(pl, id)) { log(`<i>${Wp.byId(id).name} 탄약 없음</i>`); return; }
  pl.weaponId = id; syncWeapons();
}

/* ══════════════════ UI 동기화 ══════════════════ */
function syncAim() {
  const pl = G.players[G.cur];
  if (!pl) return;
  $("iAngle").value = (pl.angle10 / 10).toFixed(1);
  $("iPower").value = pl.power;
  $("oAngle").textContent = (pl.angle10 / 10).toFixed(1) + "°";
  $("oPower").textContent = pl.power;
  $("oWind").textContent = (G.wind >= 0 ? "+" : "") + G.wind;
  $("oTurn").textContent = G.roundTurn;
  $("whoTurn").textContent = pl.isAI ? "" : pl.name;
  $("whoTurn").style.color = TEAM[pl.slot];
  $("shieldHave").textContent = `(${pl.items.shield})`;
  $("cShield").disabled = pl.items.shield === 0;
  $("iMove").disabled = pl.items.fuel === 0;
  $("iMove").placeholder = pl.items.fuel === 0 ? "연료 없음" : "";
}
$("iAngle").addEventListener("input", (e) => {
  const v = parseFloat(e.target.value); const pl = G.players[G.cur];
  if (!isNaN(v) && pl) { pl.angle10 = Math.max(0, Math.min(1800, Math.round(v * 10))); syncAim(); }
});
$("iPower").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10); const pl = G.players[G.cur];
  if (!isNaN(v) && pl) { pl.power = Math.max(0, Math.min(1000, v)); syncAim(); }
});
$("bFire").onclick = commitAim;

function syncWeapons() {
  const pl = G.players[G.cur];
  const box = $("wsel");
  if (!pl) { box.innerHTML = ""; return; }
  let h = "";
  for (const w of Wp.WEAPONS) {
    const a = M.ammoOf(pl, w.id);
    const dis = a <= 0;
    h += `<button data-w="${w.id}" ${pl.weaponId === w.id ? 'class="on"' : ""} ${dis ? "disabled" : ""}>`
      + `<div style="display:flex;justify-content:space-between;width:100%">`
      + `<span>${w.name}</span><i>${a === Infinity ? "∞" : a}</i></div>`
      + `<span class="d">${w.desc}</span></button>`;
  }
  box.innerHTML = h;
  box.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => selectWeapon(+b.dataset.w));
}

function drawCards() {
  const box = $("cards"); let h = "";
  for (const pl of G.players) {
    h += `<div class="pcard${pl.slot === G.cur && G.phase === "AIM" ? " turn" : ""}${pl.alive ? "" : " dead"}">`
      + `<div class="nm"><span style="color:${TEAM[pl.slot]}">${MARK[pl.slot]} ${pl.name}`
      + `${pl.isAI ? ' <span style="color:#6E6478;font-size:9px">AI</span>' : ""}</span>`
      + `<span style="font-family:ui-monospace">${pl.alive ? pl.hp : "✕"}</span></div>`
      + `<div class="hpbar"><i style="width:${pl.alive ? pl.hp : 0}%;background:${pl.hp > 40 ? "#B4FF3D" : "#FF3D9E"}"></i></div>`
      + `<div class="sub"><span>${pl.score}점</span><span style="color:var(--gold)">${pl.gold.toLocaleString()}G</span></div>`
      + `</div>`;
  }
  box.innerHTML = h;
}

const syncers = [];
function bind(sid, vid, get, set, fmt) {
  const s = $(sid), v = $(vid);
  const sync = () => { s.value = get(); v.textContent = fmt(get()); };
  s.addEventListener("input", () => { set(+s.value); v.textContent = fmt(+s.value); });
  syncers.push(sync); sync();
}
const q8 = (v) => `${v}/256`;
bind("sPS", "vPS", () => P.CFG.powerScale, (v) => { P.CFG.powerScale = v; showRange(); }, String);
bind("sG", "vG", () => P.CFG.gravity, (v) => { P.CFG.gravity = v; showRange(); }, String);
bind("sWM", "vWM", () => P.CFG.windMax, (v) => { P.CFG.windMax = v; deriveWind(); syncAim(); }, String);
bind("sSub", "vSub", () => G.substeps, (v) => G.substeps = v, String);
bind("sCS", "vCS", () => T.CFG.slideSandQ8, (v) => T.CFG.slideSandQ8 = v, q8);
bind("sCL", "vCL", () => T.CFG.slideSoilQ8, (v) => T.CFG.slideSoilQ8 = v, q8);

$("bSetup").onclick = showSetup;
$("bScores").onclick = () => showScores(false);
$("bShop").onclick = () => { if (G.phase === "AIM") showShop(); else log("<i>상점은 라운드 사이에만 열린다</i>"); };
$("cTrail").onchange = (e) => G.showTrail = e.target.checked;
$("cPredict").onchange = (e) => G.showPredict = e.target.checked;
$("cFast").onchange = (e) => G.fast = e.target.checked;

/* ══════════════════ 메인 루프 ══════════════════ */
let fpsT = performance.now(), fpsN = 0;
const PH = { AIM: "조준", RESOLVE: "비행", SETTLE: "붕괴", APPLY: "정산", ROUND: "라운드 종료" };

function frame() {
  if (G.phase === "RESOLVE") {
    const speed = G.fast ? 8 : 2;
    G.legTick += speed;
    let guard = 0;
    while (G.legIdx < G.legs.length && G.legTick >= G.legs[G.legIdx].pts.length && guard++ < 64) {
      G.legIdx++; G.legTick = 0;
    }
    if (G.legIdx >= G.legs.length) onAllLegsDone();
  } else if (G.phase === "SETTLE") {
    settleTick(G.fast ? G.substeps * 12 : G.substeps);
  }

  renderTerrain(); drawOverlay();

  fpsN++;
  const now = performance.now();
  if (now - fpsT > 400) {
    $("oFps").textContent = (fpsN * 1000 / (now - fpsT)).toFixed(0);
    $("oPhase").textContent = PH[G.phase] || G.phase;
    $("oSettle").textContent = G.settleSteps ? G.settleSteps.toLocaleString() : "—";
    fpsT = now; fpsN = 0;
  }
  requestAnimationFrame(frame);
}

/* ══════════════════ 부팅 ══════════════════ */
showRange();
newMatch();
log("<em>Talus 프로토타입</em> — 무기 7종 · 5라운드 · 상점 · AI\n"
  + "왼쪽에서 무기를 고르고 각도·파워를 맞춰 발사한다. 전원 입력이 끝나면 동시에 해결된다.");
requestAnimationFrame(frame);
</script>
