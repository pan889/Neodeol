<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talus · Multiplayer Harness</title>
<style>
:root{--bg:#09080c;--panel:#151119;--panel2:#1d1721;--line:#3a3040;--ink:#e8dfd2;--dim:#8d8390;--cyan:#3ddcff;--lime:#b4ff3d;--pink:#ff3d9e;--gold:#d99a5b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#271b29 0,#0b090d 48%,#070609 100%);color:var(--ink);font:13px/1.5 ui-sans-serif,system-ui;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:28px}.brand{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.brand h1{margin:0;color:var(--cyan);font:700 20px ui-monospace;letter-spacing:.22em}.brand p{margin:4px 0 0;color:var(--dim);font-size:11px;letter-spacing:.12em}.ver{color:var(--dim);font:11px ui-monospace}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{background:rgba(21,17,25,.92);border:1px solid var(--line);box-shadow:0 18px 60px #0008;padding:16px}.panel h2{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0 0 12px}.form{display:grid;gap:9px}.split{display:grid;grid-template-columns:1fr 100px;gap:8px}.row{display:flex;gap:8px}.row>*{flex:1}input,select{width:100%;background:#0d0b10;color:var(--ink);border:1px solid #433649;padding:9px;border-radius:3px}button,.toolLink{border:1px solid #55415d;background:#251b29;color:var(--ink);padding:9px 12px;border-radius:3px;text-align:center;text-decoration:none}button:hover:not(:disabled),.toolLink:hover{border-color:var(--cyan);color:var(--cyan)}button.primary{background:linear-gradient(90deg,#167b8e,#274a62);border-color:#3ddcff;color:white}button.fire{background:linear-gradient(90deg,#a92768,#e7378d);border-color:#ff63ad;color:white}button:disabled{opacity:.35;cursor:not-allowed}.hint{color:var(--dim);font-size:11px}.roomHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.code{font:700 28px ui-monospace;letter-spacing:.18em;color:var(--lime)}.badge{padding:4px 8px;border:1px solid #4b3d51;color:var(--dim);font:10px ui-monospace}.players{display:grid;gap:7px}.player{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;background:var(--panel2);border-left:3px solid #55415d;padding:9px}.player.me{border-color:var(--cyan)}.player.active{box-shadow:inset 0 0 0 1px var(--pink)}.slot{font:700 12px ui-monospace;color:var(--cyan)}.online{color:var(--lime);font-size:10px}.offline{color:#ff6f7d;font-size:10px}.turn{margin-top:14px;padding:14px;background:#0d0b10;border:1px solid #3f3345}.turnTitle{display:flex;justify-content:space-between;margin-bottom:10px}.turnTitle b{color:var(--pink);font-family:ui-monospace}.inputs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.actions{display:flex;gap:8px;margin-top:10px}.log{height:360px;overflow:auto;background:#09080c;border:1px solid #2c2530;padding:10px;font:11px/1.6 ui-monospace;color:#b9afb9}.log div{border-bottom:1px solid #18131b;padding:2px}.log .err{color:#ff6f7d}.log .event{color:var(--cyan)}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr 1fr}.shell{padding:12px}}
</style>
</head>
<body>
<main class="shell">
  <header class="brand"><div><h1>TALUS</h1><p>PHASE 4 · MULTIPLAYER NETWORK HARNESS</p></div><div id="version" class="ver">버전 확인 중</div></header>
  <div class="grid">
    <section>
      <div id="lobbyPanel" class="panel">
        <h2>코드형 로비</h2>
        <div class="form">
          <input id="name" value="포병" maxlength="24" placeholder="이름">
          <div class="split"><select id="maxPlayers"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select><button id="create" class="primary">룸 생성</button></div>
          <div class="split"><input id="joinCode" maxlength="6" placeholder="ROOM CODE"><button id="join">입장</button></div>
          <div id="recentWrap" class="split hidden"><select id="recentSessions"></select><button id="resume">최근 복귀</button></div>
          <p class="hint">새 탭에서는 같은 코드를 입력해 별도 슬롯으로 참가할 수 있습니다. 저장된 토큰은 최근 복귀에서 다시 연결합니다. 이 화면은 네트워크 기반 검증용입니다.</p>
        </div>
      </div>
      <div id="sessionPanel" class="panel hidden" style="margin-top:16px">
        <h2>연결 제어</h2>
        <div class="form"><button id="start" class="primary">매치 시작</button><button id="resync">FULL STATE 요청</button><button id="reconnect">WebSocket 재접속</button><a class="toolLink" href="/tools/prototype/?multiplayer=1">멀티 Canvas 전장 열기</a><button id="leave">세션 지우기</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="roomHead"><div><div class="hint">ROOM</div><div id="roomCode" class="code">------</div></div><div><div id="status" class="badge">OFFLINE</div><div id="mySlot" class="hint" style="text-align:right;margin-top:6px">slot —</div></div></div>
      <div id="players" class="players"><div class="hint">룸에 입장하면 플레이어가 표시됩니다.</div></div>
      <div id="turn" class="turn hidden">
        <div class="turnTitle"><b id="turnLabel">TURN —</b><span id="deadline" class="hint"></span></div>
        <div class="inputs"><input id="angle" type="number" min="0" max="180" step=".1" value="45"><input id="power" type="number" min="0" max="1000" value="600"><select id="weapon"><option value="0">표준탄</option><option value="1">파쇄탄</option><option value="2">분열탄</option><option value="3">굴착탄</option><option value="4">전복탄</option><option value="5">성형탄</option><option value="6">적층탄</option></select><input id="move" type="number" value="0" placeholder="이동 셀"><label class="hint"><input id="shield" type="checkbox" style="width:auto"> 차폐막</label></div>
        <div class="actions"><button id="fire" class="fire">INTENT 전송</button><button id="shopReady">상점 완료</button></div>
      </div>
      <h2 style="margin-top:18px">프로토콜 로그</h2><div id="log" class="log"></div>
    </section>
  </div>
</main>
<script src="msgpack.js"></script>
<script src="multiplayer.js"></script>
</body>
</html>
