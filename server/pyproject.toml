[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talus-server"
version = "0.0.0"
description = "Talus — 턴제 포병 대전 게임 서버"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# CLAUDE.md §결정론 게이트가 `pytest server/tests/test_determinism.py` 를 호출한다.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "determinism: 결정론 게이트. sim/ 을 건드리는 모든 변경이 통과해야 한다.",
  "crosssim: Python·TS 교차 검증. 골든 리플레이가 필요하다.",
]
asyncio_mode = "auto"
